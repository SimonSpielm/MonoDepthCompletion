<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="390" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6"/></marker></defs><line x1="40" y1="300" x2="920" y2="300" stroke="#2C2C2A" stroke-width="1.5"/><text x="900" y="320" font-size="12" text-anchor="end" fill="#5F5E5A" font-weight="400">Boden</text><rect x="820" y="40" width="26" height="260" fill="#D3D1C7" stroke="#5F5E5A"/><text x="833" y="30" font-size="13" text-anchor="middle" fill="#2C2C2A" font-weight="400">Wand 3 m</text><rect x="420" y="200" width="80" height="100" fill="#9FE1CB" stroke="#0F6E56"/><text x="460" y="190" font-size="13" text-anchor="middle" fill="#2C2C2A" font-weight="400">Objekt 1,5 m</text><rect x="66" y="146" width="34" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="83" y="136" font-size="13" text-anchor="middle" fill="#534AB7" font-weight="600">Kamera</text><line x1="100" y1="160" x2="420" y2="199" stroke="#888780" stroke-dasharray="3 3"/><line x1="100" y1="160" x2="820" y2="250" stroke="#888780" stroke-dasharray="3 3"/><line x1="420" y1="201" x2="820" y2="248" stroke="#E24B4A" stroke-width="4"/><line x1="102" y1="161" x2="420" y2="201" stroke="#E24B4A" stroke-width="1" stroke-dasharray="1 5"/><text x="640" y="262" font-size="13" text-anchor="middle" fill="#A32D2D" font-weight="600">Rampe des Modells</text><text x="260" y="120" font-size="12" text-anchor="middle" fill="#A32D2D" font-weight="400">verlängert läuft die Rampe fast durch</text><text x="260" y="136" font-size="12" text-anchor="middle" fill="#A32D2D" font-weight="400">die Kamera: Abstand d ≈ 0 → verwerfen</text><line x1="83" y1="176" x2="83" y2="296" stroke="#1D9E75" stroke-width="2" marker-end="url(#a)"/><text x="93" y="240" font-size="13" text-anchor="start" fill="#0F6E56" font-weight="600">d = Kamerahöhe ≈ 0,58 m</text><text x="93" y="257" font-size="12" text-anchor="start" fill="#0F6E56" font-weight="400">Boden ist echt → bleibt</text><text x="480" y="350" font-size="13" text-anchor="middle" fill="#2C2C2A" font-weight="400">Regel: Für eine Ebene im Abstand d von der Kamera gilt  f · |∇(1/z)| ≤ 1/d.</text><text x="480" y="370" font-size="13" text-anchor="middle" fill="#2C2C2A" font-weight="400">Ist die Steigung so groß, dass d &lt; 0,5 m wäre, liegt die Fläche fast im Sehstrahl: eine Rampe.</text></svg>